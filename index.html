<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LongForge Real AI Video</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070b15;color:#eef3ff;font-family:Inter,system-ui,Arial}
.wrap{max-width:1100px;margin:auto;padding:18px}.head{display:flex;gap:12px;align-items:center;margin-bottom:15px}.logo{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,#7b5cff,#16c7ff);display:grid;place-items:center;font-weight:900}.head h1{margin:0}.muted{color:#91a0ba;font-size:12px}.card{background:#101827;border:1px solid #263451;border-radius:20px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
label{display:block;font-size:12px;color:#b9c5dc;margin:0 0 6px}input,textarea,select{width:100%;padding:12px;border-radius:11px;border:1px solid #2a3854;background:#080e19;color:#fff;font:inherit}textarea{min-height:300px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0}.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:900;color:#fff;background:linear-gradient(135deg,#7b5cff,#248cff);cursor:pointer}.btn:disabled{opacity:.45}.status{margin-top:12px;padding:12px;border-radius:11px;background:#080e19;border:1px solid #263451}.bar{height:9px;background:#080e19;border:1px solid #263451;border-radius:99px;overflow:hidden;margin-top:9px}.fill{height:100%;width:0;background:linear-gradient(90deg,#7b5cff,#16c7ff)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.scene{padding:10px;border:1px solid #263451;border-radius:10px;margin-top:7px;background:#0b1220}.scene b{font-size:12px}.scene span{display:block;color:#91a0ba;font-size:11px;margin-top:3px}
</style></head><body><div class="wrap">
<div class="head"><div class="logo">LF</div><div><h1>LongForge Real AI</h1><div class="muted">Title + Topic + Script → AI visuals + voice → MP4</div></div></div>
<div class="card"><div class="grid">
<div><label>TITLE</label><input id="title" placeholder="Your video title"><label>TOPIC</label><input id="topic" placeholder="Main topic"><label>FULL SCRIPT</label><textarea id="script" placeholder="Paste the complete script here..."></textarea></div>
<div>
<label>CATEGORY</label><select id="category"><option>Cooking</option><option>Motivation</option><option>Education</option><option>Technology</option><option>Science</option><option>History</option><option>Documentary</option><option>Travel</option><option>Business</option><option>Finance</option><option>Health & Fitness</option><option>Kids</option><option>Gaming</option><option>How-To / Tutorial</option><option>Food & Recipes</option><option>Nature</option><option>Storytelling</option><option>Entertainment</option><option>All Other</option></select>
<label>LANGUAGE</label><select id="language"><option>English (USA)</option><option>Hindi</option><option>Bengali</option><option>Spanish</option><option>French</option><option>German</option><option>Portuguese</option><option>Italian</option><option>Japanese</option><option>Korean</option><option>Chinese</option><option>Arabic</option><option>Urdu</option><option>Tamil</option><option>Telugu</option><option>Marathi</option><option>Gujarati</option><option>Punjabi</option><option>Odia</option><option>Malayalam</option><option>Kannada</option><option>Nepali</option></select>
<label>DURATION</label><select id="duration"></select>
<label>VISUAL STYLE</label><select id="style"><option>Cinematic</option><option>Ultra Realistic</option><option>3D</option><option>Documentary</option><option>Animation</option><option>Luxury Branding</option></select>
<div class="row"><div><label>VOICE</label><select id="voice"><option>USA Male — Deep</option><option>USA Male — Energetic</option><option>USA Female — Warm</option><option>USA Female — Professional</option><option>Auto</option></select></div><div><label>ASPECT</label><select id="aspect"><option>16:9</option><option>9:16</option><option>1:1</option></select></div></div>
<label>BACKEND URL</label><input id="backend" value="http://localhost:8000">
<div class="actions"><button class="btn" id="generate">🎬 Generate Real Video</button></div>
<div class="muted" style="margin-top:9px">This version sends the complete title, topic, script, category, language and duration to the backend. The backend creates AI-generated scene images, narration and an MP4 with FFmpeg.</div>
</div></div></div>
<div class="card"><b>Status</b><div id="status" class="status">Ready.</div><div class="bar"><div class="fill" id="fill"></div></div><div id="scenes"></div><div class="actions"><a id="download" class="btn" style="display:none;text-decoration:none">⬇ Download MP4</a></div></div>
</div>
<script>
const $=x=>document.getElementById(x);
for(let i=1;i<=20;i++){let o=document.createElement('option');o.value=i*60;o.textContent=i+' minute'+(i>1?'s':'');if(i==10)o.selected=true;$('duration').appendChild(o)}
function showScenes(a){$('scenes').innerHTML=a.map((s,i)=>`<div class="scene"><b>Scene ${i+1}</b><span>${s.narration||s.text||''}</span></div>`).join('')}
$('generate').onclick=async()=>{
 let payload={title:$('title').value.trim(),topic:$('topic').value.trim(),script:$('script').value.trim(),category:$('category').value,language:$('language').value,duration_seconds:+$('duration').value,visual_style:$('style').value,voice:$('voice').value,aspect_ratio:$('aspect').value};
 if(!payload.title||!payload.topic||!payload.script){alert('Title, Topic and Script are required.');return}
 $('generate').disabled=true;$('download').style.display='none';$('fill').style.width='5%';$('status').textContent='Creating scene plan…';
 try{
  let base=$('backend').value.replace(/\/$/,'');
  let r=await fetch(base+'/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  if(!r.ok)throw Error(await r.text()); let d=await r.json(); if(d.scenes)showScenes(d.scenes); let id=d.job_id;
  for(;;){await new Promise(x=>setTimeout(x,1200));let q=await fetch(base+'/jobs/'+id);let j=await q.json();$('fill').style.width=(j.progress||0)+'%';$('status').textContent=j.message||j.status;if(j.scenes)showScenes(j.scenes);if(j.status==='done'){let a=$('download');a.href=base+j.video_url;a.download='LongForge_'+id+'.mp4';a.style.display='inline-block';break}if(j.status==='error')throw Error(j.message)}
 }catch(e){$('status').textContent='Error: '+e.message}finally{$('generate').disabled=false}
};
</script></body></html>
